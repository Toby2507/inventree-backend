name: inventree

x-app: &app
  image: inventree-dev:latest
  build:
    context: .
    dockerfile: Dockerfile.dev
  env_file:
    - .env
  volumes:
    - .:/app
    - /app/node_modules
  restart: unless-stopped
  networks:
    - inventree
  security_opt:
    - no-new-privileges:true

services:
  # --------------------- Infrastructure Services ---------------------
  db:
    image: postgis/postgis:18-3.6
    container_name: inventree_db
    platform: linux/amd64
    environment:
      POSTGRES_USER: inventree
      POSTGRES_DB: inventree
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    restart: unless-stopped
    ports:
      - "5433:5432"
    networks:
      - inventree
    volumes:
      - db_data:/var/lib/postgresql
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventree -d inventree"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  cache:
    image: redis:8-alpine
    container_name: inventree_cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - inventree
    volumes:
      - cache_data:/data
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-secret}
      --appendonly yes
      --maxmemory-policy noeviction
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  mailer:
    image: axllent/mailpit:v1.30
    container_name: inventree_mailer
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - 8025:8025
    networks:
      - inventree
    volumes:
      - mailer_data:/data

  # --------------------- Application Services ---------------------
  migrator:
    <<: *app
    environment:
      APP_NAME: migrator
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app
    environment:
      APP_NAME: api
    ports:
      - "8257:8257"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

  outbox-processor:
    <<: *app
    environment:
      APP_NAME: outbox-processor
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

  worker-core:
    <<: *app
    environment:
      APP_NAME: worker-core
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

  intelligence-worker:
    <<: *app
    environment:
      APP_NAME: intelligence-worker
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

  report-worker:
    <<: *app
    environment:
      APP_NAME: report-worker
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    volumes:
      - .:/app
      - /app/node_modules
      - report_tmp:/tmp/reports

networks:
  inventree:
    external: true

volumes:
  db_data:
    driver: local
    name: inventree_db_data
  cache_data:
    driver: local
    name: inventree_cache_data
  mailer_data:
    driver: local
    name: inventree_mailer_data
  report_tmp:
    driver: local
    name: inventree_report_tmp